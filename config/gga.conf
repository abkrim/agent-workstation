# Global GGA settings for the dev user (workstation-kit, modules/85-nan.sh).
# A repo's own .gga and the GGA_PROVIDER variable take precedence over this file.
# GGA reviews whole pull requests from ci-local, never on each commit.
PROVIDER="opencode:nan/glm5.3-flash"
RULES_FILE="AGENTS.md"
STRICT_MODE="true"
TIMEOUT="300"
# OpenCode agent with no tools: short output, STATUS line first (strict mode)
OPENCODE_AGENT="gga-review"
