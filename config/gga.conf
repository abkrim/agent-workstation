# Global GGA settings for the dev user (agent-workstation, modules/85-nan.sh).
# A repo's own .gga and the GGA_PROVIDER variable take precedence over this file.
# GGA reviews whole pull requests from ci-local, never on each commit.
# NaN's API is OpenAI-compatible, which is what GGA's "lmstudio" provider speaks. It points at
# nan-gate's GGA port, which adds the machine's NaN key (GGA's provider sends none).
PROVIDER="lmstudio:glm5.3-flash"
LMSTUDIO_HOST="http://127.0.0.1:4881/v1"
RULES_FILE="AGENTS.md"
STRICT_MODE="true"
TIMEOUT="300"
