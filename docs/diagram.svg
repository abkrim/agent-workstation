<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Liberation Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>

  <!-- You -->
  <text x="40" y="52" font-size="13" fill="#64748b" font-weight="bold" letter-spacing="1">YOU</text>
  <rect x="40" y="66" width="200" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="92" font-size="16" fill="#0f172a" font-weight="bold">Laptop</text>
  <text x="56" y="116" font-size="13" fill="#334155" font-family="Liberation Mono, Menlo, monospace">ssh -t dev@machine herdr</text>
  <rect x="40" y="156" width="200" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="182" font-size="16" fill="#0f172a" font-weight="bold">Phone</text>
  <text x="56" y="202" font-size="13" fill="#334155">Moshi: the same Herdr,</text>
  <text x="56" y="219" font-size="13" fill="#334155">a push when an agent needs you</text>

  <rect x="40" y="528" width="200" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="554" font-size="16" fill="#0f172a" font-weight="bold">Telegram</text>
  <text x="56" y="576" font-size="13" fill="#334155">where Hermes talks to you,</text>
  <text x="56" y="596" font-size="13" fill="#334155">and only to you</text>

  <!-- Tailscale -->
  <rect x="270" y="66" width="56" height="164" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="298" y="150" font-size="14" fill="#0c4a6e" font-weight="bold" text-anchor="middle" transform="rotate(-90 298 150)">Tailscale, the only way in</text>
  <line x1="240" y1="103" x2="268" y2="103" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="193" x2="268" y2="193" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="326" y1="148" x2="354" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPS -->
  <rect x="356" y="40" width="590" height="690" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="376" y="68" font-size="13" fill="#64748b" font-weight="bold" letter-spacing="1">YOUR VPS, UBUNTU 24.04</text>

  <!-- Herdr -->
  <rect x="376" y="82" width="550" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="392" y="108" font-size="16" fill="#0f172a" font-weight="bold">Herdr</text>
  <text x="448" y="108" font-size="13" fill="#475569">one workspace per repo and per task, nothing lost when you disconnect</text>
  <rect x="392" y="124" width="40" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="412" y="146" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Liberation Mono, Menlo, monospace">~</text>
  <rect x="442" y="124" width="100" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="146" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Liberation Mono, Menlo, monospace">my-app</text>
  <rect x="552" y="124" width="160" height="34" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="632" y="146" font-size="14" fill="#14532d" text-anchor="middle" font-family="Liberation Mono, Menlo, monospace">my-app--login</text>
  <text x="722" y="146" font-size="12" fill="#475569">the task: agents work here</text>

  <!-- Agents -->
  <rect x="376" y="192" width="265" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="392" y="220" font-size="16" fill="#0f172a" font-weight="bold">Claude Code</text>
  <text x="392" y="244" font-size="13" fill="#475569">your Claude plan, auto mode</text>
  <rect x="661" y="192" width="265" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="677" y="220" font-size="16" fill="#0f172a" font-weight="bold">gentle-shell (Pi)</text>
  <text x="677" y="244" font-size="13" fill="#475569">Gentle AI crew, NaN models</text>

  <!-- Shared -->
  <rect x="376" y="276" width="550" height="56" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="392" y="300" font-size="14" fill="#713f12" font-weight="bold">Shared by both agents</text>
  <text x="392" y="320" font-size="13" fill="#78350f">AGENTS.md, the rules of the repo · engram, one memory per repo · CodeGraph index</text>

  <!-- Flow -->
  <text x="376" y="368" font-size="13" fill="#64748b" font-weight="bold" letter-spacing="1">A TASK, START TO FINISH</text>
  <rect x="376" y="382" width="118" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="435" y="407" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Liberation Mono, Menlo, monospace" font-weight="bold">repo-add</text>
  <text x="435" y="428" font-size="12" fill="#475569" text-anchor="middle">once per repo</text>
  <line x1="494" y1="413" x2="518" y2="413" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="382" width="118" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="579" y="407" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Liberation Mono, Menlo, monospace" font-weight="bold">wt new</text>
  <text x="579" y="428" font-size="12" fill="#475569" text-anchor="middle">branch, folder, ports</text>
  <line x1="638" y1="413" x2="662" y2="413" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="664" y="382" width="118" height="62" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="723" y="407" font-size="14" fill="#14532d" text-anchor="middle" font-weight="bold">the agent works</text>
  <text x="723" y="428" font-size="12" fill="#166534" text-anchor="middle">you steer, it commits</text>
  <line x1="782" y1="413" x2="806" y2="413" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="808" y="382" width="118" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="867" y="407" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Liberation Mono, Menlo, monospace" font-weight="bold">wt rm</text>
  <text x="867" y="428" font-size="12" fill="#475569" text-anchor="middle">merge and clean up</text>

  <rect x="376" y="458" width="550" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="392" y="478" font-size="13" fill="#0f172a" font-weight="bold">wt rm, only when green:</text>
  <text x="392" y="496" font-size="13" fill="#475569">ci-local runs the checks → GGA reviews the whole PR against AGENTS.md</text>
  <text x="392" y="512" font-size="13" fill="#475569">→ push → PR → merge → folder, branch and workspace removed</text>

  <!-- Hermes and nan-gate -->
  <rect x="376" y="528" width="265" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="392" y="554" font-size="16" fill="#0f172a" font-weight="bold">Hermes</text>
  <text x="464" y="554" font-size="12" fill="#64748b">optional</text>
  <text x="392" y="576" font-size="13" fill="#475569">its own user, no sudo, no SSH;</text>
  <text x="392" y="596" font-size="13" fill="#475569">reads only the repos you share; asks first</text>
  <rect x="661" y="528" width="265" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="677" y="554" font-size="16" fill="#0f172a" font-weight="bold">nan-gate</text>
  <text x="677" y="576" font-size="13" fill="#475569">127.0.0.1 only; keeps the machine within</text>
  <text x="677" y="596" font-size="13" fill="#475569">your NaN plan: Hermes &gt; agents &gt; GGA</text>

  <!-- Security -->
  <rect x="376" y="632" width="550" height="78" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="392" y="656" font-size="14" fill="#881337" font-weight="bold">Baseline security</text>
  <text x="392" y="677" font-size="13" fill="#9f1239">firewall answers only on Tailscale · SSH keys only, no root · dev has no sudo · rootless Docker</text>
  <text x="392" y="697" font-size="13" fill="#9f1239">secrets mode 600 · security updates on their own · agents' and Hermes's reach kept apart</text>

  <!-- Outside: GitHub, NaN -->
  <text x="976" y="368" font-size="13" fill="#64748b" font-weight="bold" letter-spacing="1">OUTSIDE</text>
  <rect x="976" y="382" width="184" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="992" y="407" font-size="16" fill="#0f172a" font-weight="bold">GitHub</text>
  <text x="992" y="428" font-size="13" fill="#475569">your repos and PRs</text>
  <rect x="976" y="528" width="184" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="992" y="554" font-size="16" fill="#064e3b" font-weight="bold">NaN</text>
  <text x="992" y="576" font-size="13" fill="#065f46">GLM 5.3 Flash, DeepSeek V4</text>
  <text x="992" y="596" font-size="13" fill="#065f46">Flash, Qwen 3.8 Flash</text>
  <text x="976" y="636" font-size="11" fill="#64748b" font-style="italic">gentle-shell, GGA and Hermes</text>
  <text x="976" y="651" font-size="11" fill="#64748b" font-style="italic">reach NaN only through nan-gate</text>

  <line x1="926" y1="413" x2="974" y2="413" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="926" y1="571" x2="974" y2="571" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="242" y1="571" x2="374" y2="571" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Updates note -->
  <text x="40" y="682" font-size="13" fill="#475569">Every 3 hours (if you keep it on):</text>
  <text x="40" y="700" font-size="13" fill="#475569">Gentleman tools from main; Claude Code,</text>
  <text x="40" y="718" font-size="13" fill="#475569">Herdr and Moshi to their latest release.</text>
</svg>
